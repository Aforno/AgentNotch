name: Bug report
description: Report a reproducible problem in Agent Notch
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please do not report security vulnerabilities here. Follow SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: Agent Notch version
      placeholder: 0.3.0 — include the release URL or nightly date and commit
    validations:
      required: true
  - type: dropdown
    id: install_method
    attributes:
      label: Installation method
      options:
        - Unsigned beta or nightly ZIP
        - Signed release ZIP
        - Homebrew
        - Built from source
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS and Mac model
      placeholder: macOS 15.7, MacBook Pro with Apple silicon
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options:
        - Codex
        - Claude Code
        - Grok
        - Gemini CLI
        - Antigravity
        - OpenCode
        - Cursor
        - Not provider-specific
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the smallest repeatable sequence and any non-sensitive logs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
