name: Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if HEAD is already published as a nightly"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine signing mode
        id: check_signing
        env:
          RELEASE_MODE: ${{ vars.RELEASE_MODE }}
          NIGHTLY_MODE: ${{ vars.NIGHTLY_RELEASE_MODE }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ "${RELEASE_MODE:-}" == "unsigned-prerelease" || "${NIGHTLY_MODE:-}" == "unsigned" ]]; then
            echo "Signing mode: ad-hoc (explicitly opted out)"
            echo "release_tag=nightly-preview" >> "$GITHUB_OUTPUT"
          elif [[ -n "${MACOS_CERTIFICATE:-}" && \
                  -n "${MACOS_CERTIFICATE_PASSWORD:-}" && \
                  -n "${MACOS_SIGNING_IDENTITY:-}" && \
                  -n "${APPLE_API_KEY_ID:-}" && \
                  -n "${APPLE_API_ISSUER_ID:-}" && \
                  -n "${APPLE_API_PRIVATE_KEY:-}" ]]; then
            echo "Signing mode: signed and notarized"
            echo "release_tag=nightly" >> "$GITHUB_OUTPUT"
          else
            echo "Signing mode: ad-hoc (signing credentials not fully configured)"
            echo "release_tag=nightly-preview" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for unpublished commits
        id: check_commits
        env:
          FORCE: ${{ inputs.force || false }}
          RELEASE_TAG: ${{ steps.check_signing.outputs.release_tag }}
        run: |
          set -euo pipefail
          # This marker advances only after all release assets are published.
          PUBLISHED_SHA="$(git rev-parse --verify refs/tags/${RELEASE_TAG}-published^{commit} 2>/dev/null || true)"
          if [[ "$FORCE" != "true" && "$PUBLISHED_SHA" == "$(git rev-parse HEAD)" ]]; then
            echo "HEAD is already published as a nightly. Skipping nightly build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install repository tooling
        if: steps.check_commits.outputs.skip != 'true'
        run: brew install ripgrep

      - name: Verify repository hygiene
        if: steps.check_commits.outputs.skip != 'true'
        run: ./script/check_repository.sh

      - name: Test release configuration
        if: steps.check_commits.outputs.skip != 'true'
        run: swift test -c release

      - name: Import Developer ID certificate
        if: steps.check_commits.outputs.skip != 'true' && steps.check_signing.outputs.release_tag == 'nightly'
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/agent-notch-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          printf '%s' "$CERTIFICATE_BASE64" | /usr/bin/base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          rm -f "$CERTIFICATE_PATH"

      - name: Package release
        if: steps.check_commits.outputs.skip != 'true'
        env:
          RELEASE_TAG: ${{ steps.check_signing.outputs.release_tag }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          SPARKLE_PREVIEW_ED_PUBLIC_KEY: ${{ vars.SPARKLE_PREVIEW_ED_PUBLIC_KEY }}
          SPARKLE_PREVIEW_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_PREVIEW_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          # Use the same time-based build number as stable releases.
          export AGENT_NOTCH_BUILD_NUMBER="$(date -u +%s)"
          if [[ "$RELEASE_TAG" == "nightly" ]]; then
            API_KEY_PATH="$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8"
            printf '%s' "$API_PRIVATE_KEY" > "$API_KEY_PATH"
            chmod 0600 "$API_KEY_PATH"
            ./script/package_release.sh \
              --identity "$SIGNING_IDENTITY" \
              --notarize \
              --api-key-path "$API_KEY_PATH" \
              --api-key-id "$API_KEY_ID" \
              --api-issuer-id "$API_ISSUER_ID"
            rm -f "$API_KEY_PATH"
          elif [[ -n "$SPARKLE_PREVIEW_ED_PUBLIC_KEY" || -n "$SPARKLE_PREVIEW_ED_PRIVATE_KEY" ]]; then
            : "${SPARKLE_PREVIEW_ED_PRIVATE_KEY:?missing preview update signing key}"
            ./script/package_release.sh --adhoc --preview-updates
          else
            ./script/package_release.sh --adhoc
          fi
          cp "dist/Agent-Notch-$VERSION-macOS-arm64.dmg" "dist/Agent-Notch-Nightly-macOS-arm64.dmg"
          (cd dist && shasum -a 256 "Agent-Notch-Nightly-macOS-arm64.dmg" > "Agent-Notch-Nightly-macOS-arm64.dmg.sha256")
          if [[ "$RELEASE_TAG" == "nightly" && -n "${SPARKLE_ED_PRIVATE_KEY:-}" ]]; then
            ./script/generate_appcast.sh \
              --archive "dist/Agent-Notch-Nightly-macOS-arm64.dmg" \
              --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/$RELEASE_TAG/"
          elif [[ "$RELEASE_TAG" == "nightly-preview" && -n "$SPARKLE_PREVIEW_ED_PRIVATE_KEY" ]]; then
            ./script/generate_appcast.sh --preview-updates \
              --archive "dist/Agent-Notch-Nightly-macOS-arm64.dmg"
          fi

      - name: Publish rolling nightly GitHub release
        if: steps.check_commits.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.check_signing.outputs.release_tag }}
        run: |
          set -euo pipefail
          DATE="$(date -u +'%Y-%m-%d')"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          NIGHTLY_DMG="dist/Agent-Notch-Nightly-macOS-arm64.dmg"
          NOTES_FILE="$RUNNER_TEMP/nightly-release-notes.md"
          RELEASE_TITLE="Agent Notch Nightly ($DATE)"
          if [[ "$RELEASE_TAG" == "nightly-preview" ]]; then
            RELEASE_TITLE="Agent Notch Nightly Preview ($DATE)"
          fi
          ASSETS_TO_PUBLISH=("$NIGHTLY_DMG" "$NIGHTLY_DMG.sha256")
          if [[ -f dist/appcast.xml ]]; then
            ASSETS_TO_PUBLISH+=("dist/appcast.xml")
          fi

          cat > "$NOTES_FILE" <<EOF
          Automated nightly build for commit [\`${SHORT_SHA}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) built on ${DATE}.

          EOF

          if [[ "$RELEASE_TAG" == "nightly" ]]; then
            cat >> "$NOTES_FILE" <<'EOF'
          > [!NOTE]
          > This nightly build is signed with Developer ID and notarized by Apple.
          EOF
          else
            cat >> "$NOTES_FILE" <<'EOF'
          > [!WARNING]
          > This nightly build is ad-hoc signed and has not been notarized by Apple. macOS Gatekeeper may block or warn about it. Verify the published SHA-256 checksum before opening the app.

          Download `Agent-Notch-Nightly-macOS-arm64.dmg` and its matching `.sha256` file into the same folder. Run `shasum -a 256 -c Agent-Notch-Nightly-macOS-arm64.dmg.sha256` there and continue only if it reports `OK`. Open the DMG and drag `Agent Notch.app` onto the Applications shortcut.

          If blocked, try opening the app once, then use **System Settings → Privacy & Security → Open Anyway** and confirm the prompt. See [Apple's instructions](https://support.apple.com/en-us/102445).

          Try the [beta tester guide](https://github.com/Aforno/AgentNotch/blob/main/docs/BETA_TESTING.md) and include this build's date and commit in feedback.
          EOF
            if [[ -f dist/appcast.xml ]]; then
              printf '\nGet updates from **Settings → General → Updates**.\n' >> "$NOTES_FILE"
            else
              printf '\n**Updates are manual.** Quit Agent Notch and replace it in Applications with the latest verified DMG.\n' >> "$NOTES_FILE"
            fi
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f -a "$RELEASE_TAG" -m "Agent Notch Nightly $DATE" "$GITHUB_SHA"
          git push -f origin "refs/tags/$RELEASE_TAG"

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TITLE" \
              --notes-file "$NOTES_FILE" \
              --prerelease
            gh release upload "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              "${ASSETS_TO_PUBLISH[@]}" \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              "${ASSETS_TO_PUBLISH[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes-file "$NOTES_FILE" \
              --prerelease
          fi

          # Clean up legacy ZIPs, versioned DMGs, and any stale appcast on this channel.
          ASSETS="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          while IFS= read -r asset; do
            case "$asset" in
              Agent-Notch-Nightly-macOS-arm64.dmg|Agent-Notch-Nightly-macOS-arm64.dmg.sha256) ;;
              appcast.xml)
                if [[ ! -f dist/appcast.xml ]]; then
                  gh release delete-asset "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY" --yes
                fi
                ;;
              Agent-Notch-*-macOS-arm64.zip|Agent-Notch-*-macOS-arm64.zip.sha256|\
              Agent-Notch-*-macOS-arm64.dmg|Agent-Notch-*-macOS-arm64.dmg.sha256)
                gh release delete-asset "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY" --yes
                ;;
            esac
          done <<< "$ASSETS"

          git tag -f "${RELEASE_TAG}-published" "$GITHUB_SHA"
          git push -f origin "refs/tags/${RELEASE_TAG}-published"

      - name: Upload nightly build artifacts
        if: steps.check_commits.outputs.skip != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Agent-Notch-Nightly-macOS-arm64
          path: |
            dist/Agent-Notch-Nightly-macOS-arm64.dmg
            dist/Agent-Notch-Nightly-macOS-arm64.dmg.sha256
          retention-days: 7

      - name: Remove temporary signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/agent-notch-signing.keychain-db" || true
