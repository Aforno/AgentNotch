name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Swift 6 toolchain
        if: matrix.os == 'macos-14'
        run: sudo xcode-select --switch /Applications/Xcode_16.2.app/Contents/Developer

      - name: Install repository tooling
        run: brew install ripgrep

      - name: Show toolchain
        run: |
          swift --version
          sw_vers
          uname -m

      - name: Verify repository hygiene
        run: ./script/check_repository.sh

      - name: Audit Homebrew cask
        if: matrix.os == 'macos-15'
        run: |
          set -euo pipefail
          TAP="$(brew --repository)/Library/Taps/aforno/homebrew-agentnotch"
          if [[ ! -d "$TAP" ]]; then
            brew tap-new --no-git aforno/agentnotch
          fi
          mkdir -p "$TAP/Casks"
          cp Casks/agents-notch.rb "$TAP/Casks/agents-notch.rb"
          brew style --cask aforno/agentnotch/agents-notch

      - name: Run debug tests
        run: swift test

      - name: Run release tests
        run: swift test -c release

      - name: Verify release package structure
        if: matrix.os == 'macos-15'
        run: ./script/package_release.sh --adhoc
