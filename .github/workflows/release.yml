name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install repository tooling
        run: brew install ripgrep

      - name: Validate tag and repository
        env:
          RELEASE_MODE: ${{ vars.RELEASE_MODE }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          ./script/validate_version.sh "$GITHUB_REF_NAME"
          ./script/check_repository.sh
          if [[ "$RELEASE_MODE" == "unsigned-prerelease" ]]; then
            echo "Publishing an explicitly opted-in unsigned prerelease"
          elif [[ -z "$RELEASE_MODE" || "$RELEASE_MODE" == "signed" ]]; then
            for value in \
              "$MACOS_CERTIFICATE" \
              "$MACOS_CERTIFICATE_PASSWORD" \
              "$MACOS_SIGNING_IDENTITY" \
              "$APPLE_API_KEY_ID" \
              "$APPLE_API_ISSUER_ID" \
              "$APPLE_API_PRIVATE_KEY"; do
              if [[ -z "$value" ]]; then
                echo "signed releases require all documented signing and notarization secrets" >&2
                exit 1
              fi
            done
          else
            echo "unsupported RELEASE_MODE: $RELEASE_MODE" >&2
            exit 1
          fi

      - name: Test tagged release commit
        run: swift test -c release

      - name: Import Developer ID certificate
        if: vars.RELEASE_MODE != 'unsigned-prerelease'
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/agent-notch-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          printf '%s' "$CERTIFICATE_BASE64" | /usr/bin/base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          rm -f "$CERTIFICATE_PATH"

      - name: Package, notarize, and staple
        env:
          RELEASE_MODE: ${{ vars.RELEASE_MODE }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_MODE" == "unsigned-prerelease" ]]; then
            AGENT_NOTCH_BUILD_NUMBER="$GITHUB_RUN_NUMBER" \
              ./script/package_release.sh --adhoc
            exit 0
          fi
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8"
          printf '%s' "$API_PRIVATE_KEY" > "$API_KEY_PATH"
          chmod 0600 "$API_KEY_PATH"
          AGENT_NOTCH_BUILD_NUMBER="$GITHUB_RUN_NUMBER" \
            ./script/package_release.sh \
              --identity "$SIGNING_IDENTITY" \
              --notarize \
              --api-key-path "$API_KEY_PATH" \
              --api-key-id "$API_KEY_ID" \
              --api-issuer-id "$API_ISSUER_ID"
          rm -f "$API_KEY_PATH"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ vars.RELEASE_MODE }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          ARCHIVE="dist/Agent-Notch-$VERSION-macOS-arm64.zip"
          if [[ "$RELEASE_MODE" == "unsigned-prerelease" ]]; then
            NOTES_FILE="$RUNNER_TEMP/unsigned-prerelease-notes.md"
            cat > "$NOTES_FILE" <<'EOF'
          > [!WARNING]
          > This preview is ad-hoc signed and has not been notarized by Apple. macOS Gatekeeper may block or warn about it. Verify the published SHA-256 checksum before opening the app.
          EOF
            gh release create "$GITHUB_REF_NAME" \
              "$ARCHIVE" \
              "$ARCHIVE.sha256" \
              --verify-tag \
              --generate-notes \
              --notes-file "$NOTES_FILE" \
              --prerelease \
              --title "Agent Notch $VERSION (Unsigned Preview)"
          else
            gh release create "$GITHUB_REF_NAME" \
              "$ARCHIVE" \
              "$ARCHIVE.sha256" \
              --verify-tag \
              --generate-notes \
              --title "Agent Notch $VERSION"
          fi

      - name: Point Homebrew cask at this release
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          CHECKSUM="$GITHUB_WORKSPACE/dist/Agent-Notch-$VERSION-macOS-arm64.zip.sha256"
          git fetch origin "$DEFAULT_BRANCH"
          git checkout -B "$DEFAULT_BRANCH" "origin/$DEFAULT_BRANCH"
          ./script/update_cask.sh --version "$VERSION" --checksum-file "$CHECKSUM"
          if git diff --quiet -- Casks/agent-notch.rb; then
            echo "Homebrew cask unchanged for $VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/agent-notch.rb
          git commit -m "Point Homebrew cask at ${VERSION}"
          git push origin "$DEFAULT_BRANCH"

      - name: Remove temporary signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/agent-notch-signing.keychain-db" || true
